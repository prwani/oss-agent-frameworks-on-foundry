name: crewai-custom-storage-responses
description: CrewAI custom storage sample using the Foundry Responses adapter.
template:
  name: crewai-custom-storage-responses
  kind: hosted
  protocols:
    - protocol: responses
      version: 2.0.0
  environment_variables:
    - name: FOUNDRY_PROJECT_ENDPOINT
      value: "{{FOUNDRY_PROJECT_ENDPOINT}}"
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
    - name: COSMOS_ENDPOINT
      value: "{{COSMOS_ENDPOINT}}"
    - name: COSMOS_DATABASE_NAME
      value: "{{COSMOS_DATABASE_NAME}}"
    - name: COSMOS_CONTAINER_NAME
      value: "{{COSMOS_CONTAINER_NAME}}"
