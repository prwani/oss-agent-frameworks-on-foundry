name: crewai-azure-search-rag-responses
description: CrewAI azure search rag sample using the Foundry Responses adapter.
template:
  name: crewai-azure-search-rag-responses
  kind: hosted
  protocols:
    - protocol: responses
      version: 2.0.0
  environment_variables:
    - name: FOUNDRY_PROJECT_ENDPOINT
      value: "{{FOUNDRY_PROJECT_ENDPOINT}}"
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
    - name: AZURE_SEARCH_ENDPOINT
      value: "{{AZURE_SEARCH_ENDPOINT}}"
    - name: AZURE_SEARCH_INDEX_NAME
      value: "{{AZURE_SEARCH_INDEX_NAME}}"
