name: crewai-foundry-toolbox-mcp-skills-responses
description: CrewAI foundry toolbox mcp skills sample using the Foundry Responses adapter.
template:
  name: crewai-foundry-toolbox-mcp-skills-responses
  kind: hosted
  protocols:
    - protocol: responses
      version: 2.0.0
  environment_variables:
    - name: FOUNDRY_PROJECT_ENDPOINT
      value: "{{FOUNDRY_PROJECT_ENDPOINT}}"
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
    - name: TOOLBOX_NAME
      value: "{{TOOLBOX_NAME}}"
