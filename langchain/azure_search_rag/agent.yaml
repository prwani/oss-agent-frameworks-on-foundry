# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml
kind: hosted
name: langchain-azure-search-rag-responses
protocols:
  - protocol: responses
    version: 2.0.0
resources:
  cpu: '0.5'
  memory: '1Gi'
environment_variables:
  - name: FOUNDRY_PROJECT_ENDPOINT
    value: ${FOUNDRY_PROJECT_ENDPOINT}
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: AZURE_SEARCH_ENDPOINT
    value: ${AZURE_SEARCH_ENDPOINT}
  - name: AZURE_SEARCH_INDEX_NAME
    value: ${AZURE_SEARCH_INDEX_NAME}
  - name: AZURE_SEARCH_SEMANTIC_CONFIGURATION
    value: ${AZURE_SEARCH_SEMANTIC_CONFIGURATION}
