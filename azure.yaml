# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: oss-agent-frameworks
services:
  langchain-basic-responses:
    project: ./langchain/basic
    host: azure.ai.agent
    language: python
    uses:
    - foundry-project
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: '0.25'
        memory: 0.5Gi
    kind: hosted
    name: langchain-basic-responses
    protocols:
    - protocol: responses
      version: 2.0.0
